bundle:
  name: electrocasa_project
  uuid: eb9d4db5-1701-4c02-8b33-d63759fe1bfc

include:
  - resources/*.yml

variables:
  catalog:
    description: Catalog used by the pipeline
    default: electrocasa
  schema_bronze:
    description: Bronze layer schema
    default: bronze
  schema_silver:
    description: Silver layer schema
    default: silver
  schema_gold:
    description: Gold layer schema
    default: gold
  schema_monitoring:
    description: Monitoring layer schema
    default: monitoring
  table_monitoring:
    description: Monitoring layer table
    default: event_log_electrocasa
  root_path:
    description: Root path Pipeline
    default: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

targets:
  dev:
    mode: development
    default: true
    presets:
      source_linked_deployment: false
    workspace:
      host: https://adb-7405615539762593.13.azuredatabricks.net/
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      table_monitoring: event_log_electrocasa
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
  
  test:
    mode: production
    default: false
    presets:
      source_linked_deployment: true
    workspace:
      host: https://adb-7405615539762593.13.azuredatabricks.net/
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      table_monitoring: event_log_electrocasa_qa
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE

  prod:
    mode: production
    default: false
    presets:
      source_linked_deployment: true
    workspace:
      host: https://adb-7405615539762593.13.azuredatabricks.net/
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      table_monitoring: event_log_electrocasa_prod
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
    