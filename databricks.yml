bundle:
  name: electrocasa_project
  uuid: eb9d4db5-1701-4c02-8b33-d63759fe1bfc

include:
  - resources/*.yml

variables:
  catalog:
    description: Catalog used by the pipeline
    default: electrocasa
  schema_bronze:
    description: Bronze layer schema
    default: bronze
  schema_silver:
    description: Silver layer schema
    default: silver
  schema_gold:
    description: Gold layer schema
    default: gold
  # root_path:
  #   description: Root path Pipeline
    # default: /

targets:
  dev:
    mode: development
    default: true
    presets:
      source_linked_deployment: false
    workspace:
      host: https://dbc-fcc8b0b1-83a7.cloud.databricks.com/
      # root_path: ${var.root_path}
    variables:
      catalog: electrocasa
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
    