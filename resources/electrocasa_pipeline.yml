resources:
  pipelines:
    project_electrocasa_etl:
      name: electrocasa
      catalog: ${var.catalog}
      schema: ${var.schema_bronze}
      serverless: true
      root_path: ${workspace.file_path}/../

      libraries:
        - glob:
            include: ../src/electrocasa/transformations/**
      event_log:
        name: event_log_electrocasa
        schema: monitoring
        catalog: ${var.catalog}


